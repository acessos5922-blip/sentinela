<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Biblioteca Sentinela — materiais em PDF para concursos.">
  <title>Biblioteca Sentinela</title>
  <style>html,body{margin:0;min-height:100%;background:#f7f5ef}</style>
</head>
<body>
<script>
(async()=>{
  try{
    const parts=[
      'site/part01.txt','site/part02.txt','site/part03.txt','site/part04.txt',
      'site/part05.txt','site/part06.txt','site/part07.txt','site/part08.txt'
    ];
    const chunks=await Promise.all(parts.map(async path=>{
      const response=await fetch(path,{cache:'no-store'});
      if(!response.ok) throw new Error('Falha ao carregar '+path);
      return response.text();
    }));
    let html=chunks.join('');
    html=html.replace('</body>',`<script>(function(){var h=decodeURIComponent(location.hash.slice(1));if(h){setTimeout(function(){var e=document.getElementById(h);if(e)e.scrollIntoView();},80);}})();<\/script></body>`);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:40px;text-align:center">Não foi possível carregar o site agora. Atualize a página em alguns instantes.</div>';
    console.error(error);
  }
})();
</script>
</body>
</html>
